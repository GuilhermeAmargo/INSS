<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de INSS e IR</title>
</head>
<body>
    <h1>Cálculo do INSS e IR</h1>
    <form onsubmit="return calcularImpostos()">
        <label for="salario_bruto">Salário Bruto:</label>
        <input type="number" id="salario_bruto" name="salario_bruto" required>
        <br>
        <label for="dependentes">Número de Dependentes:</label>
        <input type="number" id="dependentes" name="dependentes" required>
        <br>
        <button type="submit">Calcular</button>
    </form>
    <h2>Resultados:</h2>
    <p>Valor INSS: <span id="valor_inss"></span></p>
    <p>Valor Imposto de Renda: <span id="valor_ir"></span></p>
    <p>Salário Líquido: <span id="salario_liquido"></span></p>

    <script>
        function calcularImpostos() {
            const salarioBruto = parseFloat(document.getElementById('salario_bruto').value);
            const dependentes = parseInt(document.getElementById('dependentes').value);
            let aliquotaINSS;
            if (salarioBruto <= 1212) {
                aliquotaINSS = 0.075;
            } else if (salarioBruto <= 2427.35) {
                aliquotaINSS = 0.09;
            } else if (salarioBruto <= 3641.03) {
                aliquotaINSS = 0.12;
            } else if (salarioBruto <= 7087.22) {
                aliquotaINSS = 0.14;
            } else {
                aliquotaINSS = 0.14;
            }
            const valorINSS = salarioBruto * aliquotaINSS;
            document.getElementById('valor_inss').textContent = valorINSS.toFixed(2);
            const baseCalculo = salarioBruto - valorINSS - (dependentes * 189.59);
            let aliquotaIR;
            let deducaoIR;
            if (baseCalculo <= 1903.98) {
                aliquotaIR = 0;
                deducaoIR = 0;
            } else if (baseCalculo <= 2826.65) {
                aliquotaIR = 0.075;
                deducaoIR = 142.80;
            } else if (baseCalculo <= 3751.05) {
                aliquotaIR = 0.15;
                deducaoIR = 354.80;
            } else if (baseCalculo <= 4664.68) {
                aliquotaIR = 0.225;
                deducaoIR = 636.13;
            } else {
                aliquotaIR = 0.275;
                deducaoIR = 869.36;
            }
            const valorIR = baseCalculo * aliquotaIR - deducaoIR;
            document.getElementById('valor_ir').textContent = Math.max(0, valorIR).toFixed(2);
            const salarioLiquido = salarioBruto - valorINSS - valorIR;
            document.getElementById('salario_liquido').textContent = salarioLiquido.toFixed(2);
            return false;
        }
    </script>
</body>
</html>
