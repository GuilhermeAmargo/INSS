<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de INSS e IR</title>
</head>
<body>
    <script src="script.js"></script>
    <h1>Cálculo do INSS e IR</h1>
    <form onsubmit="return calcularImpostos()">
        <label for="salario_bruto">Salário Bruto:</label>
        <input type="number" id="salario_bruto" name="salario_bruto" required>
        <br>
        <label for="dependentes">Número de Dependentes:</label>
        <input type="number" id="dependentes" name="dependentes" required>
        <br>
        <button type="submit">Calcular</button>
    </form>
    <h2>Resultados:</h2>
    <p>Valor INSS: <span id="valor_inss"></span></p>
    <p>Valor Imposto de Renda: <span id="valor_ir"></span></p>
    <p>Salário Líquido: <span id="salario_liquido"></span></p>
</body>
</html>
